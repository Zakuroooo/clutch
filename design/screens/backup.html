<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clutch mock-up: Back me up</title>
<link rel="stylesheet" href="mock.css">
</head>
<body style="--team-a: #2f6fe0; --team-b: #14306b; --team-b-ink: #f1ede2">
  <div class="top"><span>Back me up</span><span>You against Arjun</span></div>

  <!-- Player art: team colour and jersey number only. Never a face. -->
  <section class="versus" aria-label="Your player against their player">
    <div class="art a"><span class="jersey" aria-hidden="true">18</span><span class="role">Yours</span><span class="name">V Kohli</span></div>
    <div class="art b"><span class="jersey" aria-hidden="true">45</span><span class="role">Arjun's</span><span class="name">RG Sharma</span></div>
  </section>

  <ul class="facts" aria-label="True facts for your player, and one fair point for theirs">
    <li><span class="v">__</span><span class="k">average when chasing</span><span class="v r less">__</span></li>
    <li><span class="v">__</span><span class="k">fifties in chases</span><span class="v r less">__</span></li>
    <li><span class="v less">__</span><span class="k">strike rate, fair point to them</span><span class="v r">__</span></li>
  </ul>

  <p class="analogy" style="padding-top: var(--s-5)">Yours starts the fire. Mine is still there when it has to be put out.</p>
  <p class="micro ash" style="margin-top: var(--s-3)">Based on __ matches in our data. Numbers appear once computed.</p>

  <span class="grow"></span>
  <nav class="bar">
    <button>Another line</button>
    <button class="pill">Drop it in the room</button>
  </nav>
</body>
</html>
