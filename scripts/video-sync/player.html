<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"></head>
<body style="margin:0;background:#000">
<div id="p"></div>
<script>
window.ready=false;
var tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
var player;
function onYouTubeIframeAPIReady(){
  var q=new URLSearchParams(location.search);
  player=new YT.Player('p',{width:1280,height:720,videoId:q.get('v'),
    playerVars:{autoplay:1,mute:1,controls:0,start:+(q.get('t')||0),origin:location.origin,playsinline:1},
    events:{onReady:function(e){e.target.mute();e.target.playVideo();window.ready=true;}, onError:function(e){window.err=e.data;}}});
}
</script></body></html>
